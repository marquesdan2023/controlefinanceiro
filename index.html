<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro Pessoal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;600;700;900&display=swap');
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#222535;--border:#2e3248;--text:#e8eaf0;--text-muted:#8a8fa8;--green:#2dd4a0;--red:#f06a6a;--red-dim:#7a2020;--blue:#5b8cff;--yellow:#f5c842;--purple:#a78bfa;--obs:#8fb0ff;--obs-bg:rgba(91,140,255,.16);--radius:14px;--shadow:0 4px 18px rgba(0,0,0,.25)}
:root.light{--bg:#eef2f7;--surface:#ffffff;--surface2:#e6ebf3;--border:#dfe5ee;--text:#1e293b;--text-muted:#64748b;--green:#10b981;--red:#ef4444;--red-dim:#fee2e2;--blue:#3b82f6;--yellow:#f59e0b;--purple:#8b5cf6;--obs:#1e3a8a;--obs-bg:rgba(30,58,138,.10);--shadow:0 4px 18px rgba(30,41,59,.08)}
html{font-size:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:18px}
header{background:transparent;padding:22px 28px 6px;display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto}
header h1{font-family:'Orbitron',sans-serif;font-size:1.5rem;font-weight:700;letter-spacing:.5px;background:linear-gradient(90deg,#6d8cff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.month-nav{display:flex;align-items:center;gap:10px}
.month-nav button,#btn-tema{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 14px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:600;box-shadow:var(--shadow)}
.month-nav button:hover,#btn-tema:hover{border-color:var(--blue)}
.month-nav span{font-weight:700;min-width:140px;text-align:center}
main{max-width:1100px;margin:0 auto;padding:14px 20px 40px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.summary-card{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--blue);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.summary-card:nth-child(1){border-left-color:var(--blue)}
.summary-card:nth-child(2){border-left-color:var(--green)}
.summary-card:nth-child(3){border-left-color:var(--yellow)}
.summary-card:nth-child(4){border-left-color:var(--red)}
.summary-card:nth-child(5){border-left-color:var(--yellow)}
.summary-card:nth-child(6){border-left-color:var(--purple)}
.summary-card:nth-child(7){border-left:5px dashed var(--blue)}
.summary-card .label{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--text-muted);margin-bottom:8px}
.summary-card .value{font-family:'Orbitron',sans-serif;font-size:1.05rem;font-weight:800;line-height:1.25;word-break:break-word}
.summary-card .hint{font-size:.74rem;color:var(--text-muted);margin-top:6px;line-height:1.2}
.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.yellow{color:var(--yellow)}.muted{color:var(--text-muted)}.purple{color:var(--purple)}
.obs{color:var(--obs);font-weight:700;font-size:.95em;background:var(--obs-bg);border-radius:6px;padding:1px 8px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 18px}
.tab{background:var(--surface2);border:none;color:var(--text);border-radius:12px;padding:11px 20px;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s,background .15s}
.tab:hover{transform:translateY(-1px);background:var(--border)}
.tab.ativo{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(59,130,246,.35)}
.aba{display:none}
.aba.ativo{display:block;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
#aba-resumo.ativo{background:transparent;border:none;box-shadow:none;padding:0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:760px){.two-col{grid-template-columns:1fr}.aba.ativo{padding:16px}}
.panel{background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.aba .panel:last-child{margin-bottom:0}
.panel h2{font-family:'Orbitron',sans-serif;font-size:.95rem;font-weight:700;margin-bottom:14px}
.panel .sub{font-size:.88rem;color:var(--text-muted);margin:-8px 0 12px}
label{font-size:.85rem;color:var(--text-muted);display:block;margin-bottom:4px}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:1rem;padding:10px 12px;outline:none}
.panel input,.panel select{margin-bottom:10px}
input:focus,select:focus{border-color:var(--blue)}
.btn{width:100%;margin-top:6px;padding:11px;border:none;border-radius:10px;font-family:'Rajdhani',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:transform .1s}
.btn:hover{opacity:.92;transform:translateY(-1px)}
.btn-entrada{background:var(--green);color:#fff}.btn-saida{background:var(--red);color:#fff}.btn-inv{background:var(--blue);color:#fff}
.tx-list{display:flex;flex-direction:column;gap:8px;max-height:460px;overflow-y:auto}
.tx-item{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:.92rem}
.tx-item.pendente{opacity:.6}
.tx-item.vence-hoje,.tx-item.atrasada{border-left:4px solid var(--red)!important;opacity:1!important}
.tx-item.vence-amanha{border-left:4px solid var(--yellow)!important;opacity:1!important}
.tx-check{width:24px;height:24px;flex-shrink:0;border-radius:50%;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-size:.75rem;color:transparent}
.tx-check:hover{border-color:var(--green)}
.tx-check.pago{background:var(--green);border-color:var(--green);color:#fff}
.tx-info{flex:1;min-width:0}
.tx-desc{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{color:var(--text-muted);font-size:.82rem;margin-top:2px}
.tx-value{font-family:'Orbitron',sans-serif;font-weight:700;font-size:.88rem;white-space:nowrap}
.tx-del,.tx-edit{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.9rem;padding:3px 6px;border-radius:6px}
.tx-del:hover{color:var(--red);background:var(--red-dim)}
.tx-edit:hover{color:var(--blue)}
.empty{text-align:center;color:var(--text-muted);font-size:.9rem;padding:22px 0}
.loading{text-align:center;padding:20px;color:var(--text-muted)}
.list-controls{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.filter-btn{background:var(--surface2);border:none;color:var(--text-muted);border-radius:8px;padding:5px 12px;font-family:'Rajdhani',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer}
.filter-btn:hover{color:var(--text)}
.filter-btn.ativo{background:var(--blue);color:#fff}
.search-box{position:relative;margin-bottom:8px}
.search-box input{padding-left:34px;margin-bottom:0!important}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
.search-count{font-size:.75rem;color:var(--text-muted);text-align:right;margin-bottom:6px;min-height:14px}
.toggle-parcelas{display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer;font-size:.9rem;user-select:none}
.toggle-parcelas input{display:none}
.toggle-track{width:36px;height:20px;background:var(--border);border-radius:10px;position:relative;flex-shrink:0}
.toggle-thumb{width:14px;height:14px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .2s}
.toggle-parcelas input:checked~.toggle-track{background:var(--blue)}
.toggle-parcelas input:checked~.toggle-track .toggle-thumb{left:19px}
.parcelas-box{background:var(--surface2);border-radius:10px;padding:12px;margin-bottom:10px;display:none}
.parcelas-box.ativo{display:block}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.parcelas-preview{font-size:.85rem;color:var(--blue);min-height:16px}
.caixa-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.caixa-wrap input{max-width:170px;margin:0!important;font-family:'Orbitron',sans-serif}
.btn-caixa{padding:10px 18px;background:var(--green);color:#fff;border:none;border-radius:10px;font-family:'Rajdhani',sans-serif;font-weight:700;cursor:pointer}
.proj-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:700px){.proj-grid{grid-template-columns:1fr 1fr}}
.proj-item{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--blue);border-radius:12px;padding:14px}
.proj-item:nth-child(1){border-left-color:var(--purple)}
.proj-item:nth-child(2){border-left-color:var(--yellow)}
.proj-item:nth-child(3){border-left-color:var(--red)}
.proj-item:nth-child(4){border-left:5px dashed var(--blue)}
.proj-item .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:6px}
.proj-item .value{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:800}
.proj-nota{margin-top:14px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.progresso-header{display:flex;justify-content:space-between;margin-bottom:10px}
