    --red: #f06a6a;

    --blue: #5b8cff;
    --yellow: #f5c842;
    --radius: 12px;

  header {

  header h1 { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; font-weight: 700; color: var(--green); letter-spacing: 1px; text-transform: uppercase; }

  .month-nav button { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 13px; cursor: pointer; font-size: 1rem; transition: background 0.15s; }

  .summary-card .value { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px; }
  .value.green { color: var(--green); }
  .value.red { color: var(--red); }
  .value.blue { color: var(--blue); }
  .value.yellow { color: var(--yellow); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .two-col { grid-template-columns: 1fr; } }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .panel h2 { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .form-row.single { grid-template-columns: 1fr; }
  label { font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
  input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Rajdhani', sans-serif; font-size: 1rem; padding: 9px 12px; outline: none; transition: border-color 0.15s; }
  input:focus { border-color: var(--green); }

  .btn { width: 100%; margin-top: 12px; padding: 10px; border: none; border-radius: 8px; font-family: 'Rajdhani', sans-serif; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
  .btn:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-entrada { background: var(--green); color: #0a1a14; }
  .btn-saida { background: var(--red); color: #fff; }

  .tx-list { display: flex; flex-direction: column; gap: 7px; max-height: 380px; overflow-y: auto; }

  .tx-item { display: flex; align-items: center; gap: 10px; background: var(--surface2); border-radius: 8px; padding: 11px 14px; font-size: 0.92rem; }
  .tx-item.pendente { opacity: 0.5; }

  .tx-check {
    width: 24px; height: 24px; flex-shrink: 0;
    border-radius: 50%; border: 2px solid var(--border);
    background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; color: transparent;
    transition: border-color 0.15s, background 0.15s;
  }
  .tx-check:hover { border-color: var(--green); }
  .tx-check.pago { background: var(--green); border-color: var(--green); color: #0a1a14; }

  .tx-info { flex: 1; min-width: 0; }
  .tx-desc { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-meta { color: var(--text-muted); font-size: 0.82rem; margin-top: 2px; }

  .tx-value { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 0.95rem; white-space: nowrap; }
  .tx-value.green { color: var(--green); }
  .tx-value.red { color: var(--red); }
  .tx-value.muted { color: var(--text-muted); }

  .tx-del { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.95rem; padding: 2px 5px; border-radius: 4px; line-height: 1; transition: color 0.15s, background 0.15s; }
  .tx-del:hover { color: var(--red); background: var(--red-dim); }

  .empty { text-align: center; color: var(--text-muted); font-size: 0.82rem; padding: 20px 0; }

  #toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; font-size: 0.85rem; color: var(--text); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999; }
  #toast.show { opacity: 1; }

  #fb-config-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 500; }
  #fb-config-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; width: min(480px, 95vw); }
  #fb-config-box h2 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; margin-bottom: 8px; color: var(--green); }
